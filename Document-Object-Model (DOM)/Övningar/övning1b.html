<!DOCTYPE html>
<html>
  <body>
    <div id="myDiv">Users:</div>
    <ul>
      <li>John</li>
      <li>Pete</li>
    </ul>
    <h4 class="myClass">These were all the users</h4>
    <p class="myClass">Thanks for checking in</p>

    <script>
      console.log(document.querySelector("#myDiv").nodeName)
      let classNames = document.querySelectorAll(".myClass")
      for(let i = 0; i < classNames.length; i++){
        console.log(classNames[i].nodeName)
      }
      let tagNames = document.querySelectorAll("li")
      for(let i = 0; i < tagNames.length; i++){
        console.log(tagNames[i].nodeName)
      }
    </script>
  </body>
</html>
